@if (notificationMessage()) {
  <div
    class="notification"
    [class.success]="notificationType() === 'success'"
    [class.error]="notificationType() === 'error'">
    {{ notificationMessage() }}
  </div>
}

@if (subStep() === 'basico') {

  <!-- Datos personales. -->
  <div class="personal-grid">

    <div class="field-card large">
      <label>Nombres (s)</label>
      <input
        type="text"
        name="strNombre"
        maxlength="250"
        [(ngModel)]="employee.strNombre"
      />

      <label>Apellido Materno</label>
      <input
        type="text"
        name="strApellidoMat"
        maxlength="250"
        [(ngModel)]="employee.strApellidoMat"
      />

      <label>Apellido Paterno</label>
      <input
        type="text"
        name="strApellidoPat"
        maxlength="250"
        [(ngModel)]="employee.strApellidoPat"
      />
    </div>

    <div class="right-column">

      <div class="field-card curp">
        <label>CURP</label>
        <input
          type="text"
          name="strCurp"
          maxlength="18"
          [(ngModel)]="employee.strCurp"
        />
      </div>

      <div class="field-card sexo">
        <label>Sexo</label>

        <select
          name="idSexo"
          [(ngModel)]="employee.idSexo">

          <option [ngValue]="0">Seleccione</option>

          @for (sex of sexes(); track sex.id) {
            <option [ngValue]="sex.id">
              {{ sex.strValor }}
            </option>
          }

        </select>
      </div>

    </div>

  </div>

  <!-- Archivos del empleado. -->
  <div class="upload-row">

    <!-- INE. -->
    <div class="upload-card">
      <label>Identificación oficial INE</label>

      <input
        type="file"
        accept=".jpg,.jpeg,.png,image/jpeg,image/png"
        (change)="onIneSelected($event)"
      />

      @if (inePreviewUrl()) {
        <img
          [src]="inePreviewUrl()"
          class="preview-image"
          alt="Vista previa del INE"
        />
      }
    </div>

    <!-- Fotografía. -->
    <div class="upload-card">
      <label>Carga o archivo de fotografía del trabajador</label>

      <input
        type="file"
        accept=".jpg,.jpeg,.png,image/jpeg,image/png"
        (change)="onFotografiaSelected($event)"
      />

      @if (fotografiaPreviewUrl()) {
        <img
          [src]="fotografiaPreviewUrl()"
          class="preview-image"
          alt="Vista previa de la fotografía"
        />
      }
    </div>

  </div>
}

@if (subStep() === 'academico') {

  <div class="academico-grid">

    <!-- Perfil académico. -->
    <div class="field-card perfil">
      <label>¿Tiene perfil académico?</label>

      <div class="radio-group">

        <label class="radio-option">
          <input
            type="radio"
            name="tienePerfilAcademico"
            value="SI"
            [(ngModel)]="tienePerfilAcademico"
          />
          Sí
        </label>

        <label class="radio-option">
          <input
            type="radio"
            name="tienePerfilAcademico"
            value="NO"
            [(ngModel)]="tienePerfilAcademico"
          />
          No
        </label>

      </div>

      <div *ngIf="tienePerfilAcademico === 'SI'">

        <label>
          Perfil académico (programas educativos en los que participa o imparte clases)
        </label>

        <div class="inline-field">

          <select
            name="perfilAcademicoSeleccionado"
            [(ngModel)]="perfilAcademicoSeleccionado">

            <option [ngValue]="null">Seleccione</option>

            @for (perfil of perfilesAcademicos(); track perfil.id) {
              <option [ngValue]="perfil.id">
                {{ perfil.strValor }}
              </option>
            }

          </select>

          <button
            type="button"
            class="btn-agregar"
            (click)="agregarPerfilAcademico()">
            Agregar
          </button>

        </div>

        <label>Perfiles académicos agregados</label>

        <div class="added-list">

          <p
            *ngIf="perfilesAgregados.length === 0"
            class="empty-hint">
            Aún no has agregado ningún perfil académico.
          </p>

          <div
            class="added-item"
            *ngFor="let perfil of perfilesAgregados">

            <span>{{ perfil.strValor }}</span>

            <button
              type="button"
              class="btn-quitar"
              (click)="quitarPerfilAcademico(perfil.id)">
              ✕
            </button>

          </div>

        </div>

      </div>
    </div>

    <!-- SNI/SNII. -->
    <div class="field-card sni">
      <label>SNI/SNII, en caso de aplicar.</label>

      <div class="radio-group">

        <label class="radio-option">
          <input
            type="radio"
            name="tieneSNII"
            value="SI"
            [(ngModel)]="tieneSNII"
          />
          Sí
        </label>

        <label class="radio-option">
          <input
            type="radio"
            name="tieneSNII"
            value="NO"
            [(ngModel)]="tieneSNII"
          />
          No
        </label>

      </div>

      <input
        type="text"
        name="snii"
        placeholder="Nivel o folio del SNI/SNII"
        maxlength="12"
        [disabled]="tieneSNII !== 'SI'"
        [(ngModel)]="snii"
      />
    </div>

  </div>
}
